name: Kaoyan Shuati CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Zero-Dependency Unit Tests & Schema Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check all ES Modules & Serverless Functions (Full Recursive Scan)
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execFileSync } = require("child_process");
            const files = ["sw.js"];
            const walk = (dir) => {
              if (!fs.existsSync(dir)) return;
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const full = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(full);
                else if (entry.isFile() && full.endsWith(".js")) files.push(full);
              }
            };
            ["js", "functions", "tests"].forEach(walk);
            for (const f of files) {
              execFileSync(process.execPath, ["--check", f], { stdio: "inherit" });
            }
            console.log(`[Syntax Check] All ${files.length} JS files passed node --check.`);
          '

      - name: Run zero-dependency node:test suites
        run: node --test tests/quiz.test.js tests/store.test.js tests/sync.test.js tests/api.test.js tests/ui.test.js

      - name: Validate data/catalog.json & Question Bank JSON Schema
        run: |
          node -e '
            const fs = require("fs");
            const catalog = JSON.parse(fs.readFileSync("data/catalog.json", "utf8"));
            if (!catalog.defaultBankId || !Array.isArray(catalog.banks) || catalog.banks.length === 0) {
              throw new Error("Invalid data/catalog.json structure");
            }
            const validateBank = (path) => {
              const bank = JSON.parse(fs.readFileSync(path, "utf8"));
              if (!Array.isArray(bank.questions) || bank.questions.length !== bank.total) {
                throw new Error(`${path}: questions count (${bank.questions?.length}) != total (${bank.total})`);
              }
              for (const q of bank.questions) {
                if (!q.id || !q.stem || !Array.isArray(q.options) || q.options.length !== 4 || !q.answer) {
                  throw new Error(`${path}: invalid question schema at ${q.id}`);
                }
              }
              console.log(`[Validated] ${path}: ${bank.total} questions OK`);
            };
            validateBank("data/questions.sample.json");
            if (fs.existsSync("data/questions.json")) validateBank("data/questions.json");
            for (const b of catalog.banks) {
              if (fs.existsSync(b.file)) validateBank(b.file);
            }
          '
